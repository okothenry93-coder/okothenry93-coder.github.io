<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — WATCHIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-box">
    <h1 class="brand-name" style="text-align:center;">WATCH<span class="accent">IT</span></h1>
    <p class="sub">Administrator sign-in</p>

    <form id="loginForm">
      <div class="form-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <p class="form-error" id="loginError"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
    </form>

    <p class="sub" style="margin-top: 20px;"><a href="../index.html">&larr; Back to WATCHIT</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
